<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#1b1f18"/>
  <!-- grass top: 5 rows of pixel noise -->
  <g fill="#5f9c3a">
    <rect x="1" y="2" width="14" height="5"/>
  </g>
  <g fill="#78b849">
    <rect x="2" y="3" width="3" height="1"/>
    <rect x="7" y="2" width="2" height="2"/>
    <rect x="11" y="4" width="3" height="2"/>
  </g>
  <g fill="#4a7c2c">
    <rect x="1" y="6" width="4" height="1"/>
    <rect x="6" y="5" width="2" height="2"/>
    <rect x="10" y="6" width="5" height="1"/>
    <rect x="3" y="2" width="1" height="1"/>
  </g>
  <!-- dirt body -->
  <rect x="1" y="7" width="14" height="8" fill="#7a5433"/>
  <g fill="#96693f">
    <rect x="2" y="8" width="3" height="2"/>
    <rect x="8" y="9" width="2" height="2"/>
    <rect x="5" y="12" width="3" height="1"/>
    <rect x="12" y="8" width="2" height="2"/>
    <rect x="11" y="12" width="2" height="1"/>
  </g>
  <g fill="#5c3d24">
    <rect x="6" y="8" width="1" height="1"/>
    <rect x="9" y="12" width="1" height="2"/>
    <rect x="1" y="12" width="1" height="1"/>
    <rect x="13" y="10" width="1" height="1"/>
    <rect x="4" y="10" width="1" height="1"/>
  </g>
  <!-- outline -->
  <g fill="#0e120c">
    <rect x="0" y="0" width="16" height="1"/>
    <rect x="0" y="15" width="16" height="1"/>
    <rect x="0" y="1" width="1" height="14"/>
    <rect x="15" y="1" width="1" height="14"/>
  </g>
  <g fill="#3d2a18">
    <rect x="1" y="1" width="14" height="1"/>
    <rect x="1" y="14" width="14" height="1"/>
    <rect x="1" y="1" width="1" height="13"/>
  </g>
</svg>
